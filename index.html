<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates - Grupo Lipetral</title>
    <style>
        :root {
            --primary-color: #C4A54E;
            --bg-dark: #1e1e1e;
            --bg-light: #f4f4f4;
            --text-color: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral (Menu) */
        aside {
            width: 320px;
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            border-right: 3px solid var(--primary-color);
            box-shadow: 4px 0 10px rgba(0,0,0,0.2);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .sidebar-header img {
            width: 140px;
            margin-bottom: 10px;
        }

        .sidebar-header h1 {
            font-size: 16px;
            color: var(--primary-color);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-container {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            cursor: pointer;
        }

        select:hover, select:focus {
            border-color: var(--primary-color);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-item {
            padding: 10px 15px;
            background-color: #2a2a2a;
            border-left: 4px solid #444;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #ccc;
        }

        .card-item:hover {
            background-color: #333;
            color: #fff;
            border-left-color: var(--primary-color);
            transform: translateX(3px);
        }

        .card-item.active {
            background-color: #3a3a3a;
            color: #fff;
            border-left-color: var(--primary-color);
            font-weight: bold;
        }

        /* Área Principal (Preview) */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #e5e5e5;
        }

        .preview-header {
            background-color: #ffffff;
            padding: 15px 30px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #333;
        }

        .path-badge {
            background-color: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            border: 1px solid #ccc;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-copiar {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-copiar:hover {
            background-color: #b09140;
        }

        .toast {
            font-size: 13px;
            color: #27ae60;
            font-weight: bold;
            display: none;
        }

        .preview-body {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        iframe {
            width: 100%;
            max-width: 650px;
            height: 100%;
            background: #fff;
            border: none;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Barra Lateral de Seleções -->
    <aside>
        <div class="sidebar-header">
            <img src="https://api.lipetral.com.br:5030/portalrh/Contents/images/default/masterpage/grupo_lipe.PNG" alt="Grupo Lipetral">
            <h1>Email Templates</h1>
        </div>
        
        <div class="menu-container">
            <div class="section-title">1. Selecione a Marca</div>
            <select id="marcaSelect" onchange="atualizarCards()">
                <option value="Grupo-Lipetral">Grupo Lipetral</option>
                <option value="Lipetral-Agro">Lipetral Agro</option>
                <option value="Lipetral-Irrigacao">Lipetral Irrigação</option>
                <option value="Lipetral-Maquinas">Lipetral Máquinas</option>
                <option value="Lipetral-Metalmecanica">Lipetral Metalmecânica</option>
                <option value="Lipetral-Transportes">Lipetral Transportes</option>
            </select>

            <div class="section-title">2. Selecione o Template</div>
            <div class="card-list" id="cardList"></div>
        </div>
    </aside>

    <!-- Área de Visualização -->
    <main>
        <div class="preview-header">
            <div class="header-info">
                <h2 id="previewTitle">Selecione um template</h2>
                <span class="path-badge" id="pathBadge">Nenhum arquivo selecionado</span>
            </div>
            <div class="header-actions">
                <span class="toast" id="toastMsg">Copiado com sucesso!</span>
                <button class="btn-copiar" onclick="copiarHtmlAtual()">Copiar Código HTML</button>
            </div>
        </div>
        <div class="preview-body">
            <iframe id="previewFrame" src="about:blank"></iframe>
        </div>
    </main>

    <script>
        const templates = [
            { id: 'Action', nome: 'Action / Chamada' },
            { id: 'Alerta', nome: 'Alerta' },
            { id: 'Aviso', nome: 'Aviso' },
            { id: 'Erros', nome: 'Erros / Falhas' },
            { id: 'Indicadores', nome: 'Indicadores (KPIs)' },
            { id: 'Informativo', nome: 'Informativo' },
            { id: 'Sucesso', nome: 'Sucesso' },
            { id: 'Tabela', nome: 'Tabela Dinâmica' }
        ];

        let caminhoAtual = '';

        function atualizarCards() {
            const marca = document.getElementById('marcaSelect').value;
            const container = document.getElementById('cardList');
            container.innerHTML = '';

            templates.forEach((tpl, index) => {
                const div = document.createElement('div');
                div.className = 'card-item';
                div.innerText = tpl.nome;
                div.onclick = () => carregarTemplate(marca, tpl.id, tpl.nome, div);
                container.appendChild(div);

                if (index === 0) {
                    div.click();
                }
            });
        }

        function carregarTemplate(marca, arquivoId, nomeAmigavel, elementoCard) {
            document.querySelectorAll('.card-item').forEach(el => el.classList.remove('active'));
            elementoCard.classList.add('active');

            caminhoAtual = `${marca}/${arquivoId}.html`;

            document.getElementById('previewTitle').innerText = `${nomeAmigavel} (${marca.replace('-', ' ')})`;
            document.getElementById('pathBadge').innerText = caminhoAtual;
            document.getElementById('previewFrame').src = caminhoAtual;
        }

        async function copiarHtmlAtual() {
            if (!caminhoAtual) return;
            try {
                // Faz o fetch do arquivo HTML físico na pasta
                let response = await fetch(caminhoAtual);
                if (!response.ok) throw new Error('Arquivo não encontrado');
                let htmlContent = await response.text();

                // Copia para a área de transferência
                await navigator.clipboard.writeText(htmlContent);

                // Mostra mensagem de sucesso temporária
                const toast = document.getElementById('toastMsg');
                toast.style.display = 'inline';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2500);
            } catch (err) {
                alert('Erro ao copiar o código. Verifique se o arquivo HTML existe na pasta correspondente.');
            }
        }

        window.onload = () => {
            atualizarCards();
        };
    </script>
</body>
</html>
